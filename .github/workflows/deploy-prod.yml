# ---------------------------------------------------------------------------
# Deploy to Prod – triggered automatically when Deploy to Dev succeeds,
# but pauses at the "production" GitHub Environment approval gate before
# any Terraform runs. A human reviewer must approve – no manual trigger needed.
#
# Trunk-based promotion policy:
#   Code merged to main → CI → Dev auto-deploy → Prod auto-triggered
#   → paused for approval → approved → Prod deployed.
#
# Flow:
#   1. check-secrets  – detect whether AWS secrets are configured; skip all
#                       deployment steps if they are not (clean skip > red fail)
#   2. Derive the image tag from the triggering commit SHA (same tag CI pushed)
#   3. GitHub pauses at the "production" environment gate until a reviewer approves
#   4. On approval: authenticate → update kubeconfig → terraform apply (prod)
#   5. Acceptance test (placeholder)
#
# Required GitHub secrets (same as dev):
#   AWS_ROLE_ARN, AWS_ACCOUNT_ID, EKS_CLUSTER_NAME
#
# Required GitHub Environment:
#   "production" – configure required reviewers in Settings → Environments
# ---------------------------------------------------------------------------
name: Deploy to Prod

on:
  workflow_run:
    workflows: ["Deploy to Dev"]
    types: [completed]
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Gate: detect whether AWS secrets are present.
  # --------------------------------------------------------------------------
  check-secrets:
    name: Check deployment secrets
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      has-aws: ${{ steps.check.outputs.has-aws }}
    steps:
      - name: Detect AWS secrets
        id: check
        env:
          SECRET: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [[ -n "$SECRET" ]]; then
            echo "has-aws=true"  >> "$GITHUB_OUTPUT"
            echo "AWS secrets are configured – deployment will proceed."
          else
            echo "has-aws=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_ROLE_ARN secret is not set. Skipping deployment to prod."
            echo "Add AWS_ROLE_ARN, AWS_ACCOUNT_ID, and EKS_CLUSTER_NAME as repository secrets to enable real deployments."
          fi

  # --------------------------------------------------------------------------
  # Deploy: only runs when check-secrets confirms secrets exist
  # --------------------------------------------------------------------------
  deploy-prod:
    name: Terraform Apply – Prod
    runs-on: ubuntu-latest
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.has-aws == 'true' }}
    environment: production   # ← approval gate is configured here in GitHub UI
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # -----------------------------------------------------------------------
      # Derive image tag from the commit SHA that triggered this pipeline
      # -----------------------------------------------------------------------
      - name: Derive image tag
        id: tag
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "image_tag=ghcr.io/${REPO_LC}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # AWS + kubeconfig
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --kubeconfig /tmp/kubeconfig

      # -----------------------------------------------------------------------
      # Terraform
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10"

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/environments/prod

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="image=${{ steps.tag.outputs.image_tag }}" \
            -var="kube_context=arn:aws:eks:us-east-1:${{ secrets.AWS_ACCOUNT_ID }}:cluster/${{ secrets.EKS_CLUSTER_NAME }}" \
            -out=tfplan
        working-directory: terraform/environments/prod
        env:
          KUBECONFIG: /tmp/kubeconfig

      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: terraform/environments/prod
        env:
          KUBECONFIG: /tmp/kubeconfig

      # -----------------------------------------------------------------------
      # Acceptance test
      # -----------------------------------------------------------------------
      # TODO: replace with a real check, e.g.:
      #   RESPONSE=$(curl -sf http://helloworld.example.com/)
      #   echo "$RESPONSE" | grep "Hello from Docker" || exit 1
      - name: Acceptance test (placeholder)
        run: |
          echo "TODO: curl http://helloworld.example.com/ and assert HTTP 200 + 'Hello from Docker!'."
          exit 0

      # -----------------------------------------------------------------------
      # Audit trail – record which image was deployed and who approved
      # -----------------------------------------------------------------------
      - name: Record deployment
        if: success()
        run: |
          echo "Deployed ${{ steps.tag.outputs.image_tag }} to prod"
          echo "Triggered by: ${{ github.actor }}"
          echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
